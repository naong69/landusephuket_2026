# The project folder is the web root, so block files that must never be served.
# Dotfiles/dirs: .env, .env.example, .git, .gitignore, .htaccess ...
<LocationMatch "(^|/)\.">
    Require all denied
</LocationMatch>
# Docker / build files and data folders
<LocationMatch "^/(docker-compose\.ya?ml|Dockerfile|docker/|sql/|geoserver_data/|geoserver_shp/|geoserver_templates/)">
    Require all denied
</LocationMatch>
<FilesMatch "\.(sql|ftl|md)$">
    Require all denied
</FilesMatch>

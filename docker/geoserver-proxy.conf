# Same-origin proxy: http://<site>/geoserver/phuket_lu_law/...  ->  geoserver container.
# Only the phuket_lu_law workspace (WMS) is exposed; the GeoServer admin UI (/geoserver/web)
# and REST API are NOT proxied. Reach the admin via port 8082 bound to 127.0.0.1 (see docker-compose.yml).
ProxyRequests Off
ProxyPreserveHost Off
ProxyTimeout 30
ProxyPass        /geoserver/phuket_lu_law/ http://geoserver:8080/geoserver/phuket_lu_law/
ProxyPassReverse /geoserver/phuket_lu_law/ http://geoserver:8080/geoserver/phuket_lu_law/

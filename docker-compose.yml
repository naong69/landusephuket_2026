services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luphuket_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: landuse@phuket
      DB_NAME: landuse_phuket
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: luphuket_db
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: landuse@phuket
      MYSQL_DATABASE: landuse_phuket
    volumes:
      - ./landuse_phuket.sql:/docker-entrypoint-initdb.d/landuse_phuket.sql
      - db_data:/var/lib/mysql
    restart: always

  geoserver:
    image: kartoza/geoserver:2.24.0
    container_name: luphuket_geoserver
    ports:
      - "8082:8080"
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
    restart: always

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: luphuket_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    restart: always

volumes:
  db_data:
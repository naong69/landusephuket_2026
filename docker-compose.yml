services:
  web:
    build: .
    container_name: luphuket_web
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - .:/var/www/html/
    environment:   # values come from .env (copy .env.example)
      DB_HOST: db
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:?set DB_PASS in .env}
      DB_NAME: ${DB_NAME:-landuse_phuket}
      ADMIN_USER: ${ADMIN_USER:?set ADMIN_USER in .env}
      ADMIN_PASS: ${ADMIN_PASS:?set ADMIN_PASS in .env}
    depends_on:
      - db
      - geoserver

  db:
    image: mariadb:10.6
    container_name: luphuket_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
      MYSQL_DATABASE: ${DB_NAME:-landuse_phuket}
    ports:
      - "127.0.0.1:3307:3306"   # host-only; not reachable from the internet
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql

  geoserver:
    image: kartoza/geoserver:2.19.0
    platform: linux/amd64   # image is amd64-only; runs emulated on Apple Silicon
    container_name: luphuket_geoserver
    ports:
      - "127.0.0.1:8082:8080"   # GeoServer admin: host-only (use SSH tunnel on production)
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?set GEOSERVER_ADMIN_PASSWORD in .env}
    volumes:
      - ./geoserver_data:/opt/geoserver/data_dir
      - ./geoserver_templates:/opt/geoserver/data_dir/templates
      - ./geoserver_shp:/opt/geoserver/data_dir/shp

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: luphuket_phpmyadmin
    ports:
      - "127.0.0.1:8090:80"     # phpMyAdmin: host-only
    environment:
      PMA_HOST: db
      PMA_PORT: 3306   # log in with DB_USER / DB_PASS from .env
    depends_on:
      - db

volumes:
  db_data:
